name: "🐞 بلاغ عن خلل — Bug report"
description: "شيء لا يعمل كما ينبغي — Something is not working as expected"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        شكراً لإبلاغك. يمكنك الكتابة بالعربية أو الإنجليزية.
        **لا تلصق مفتاح الـ API أو محتوى ملف `.env` هنا.** والثغرات الأمنية لا تُبلَّغ علناً: راجع [SECURITY.md](https://github.com/saeedbark/montaji/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: "ماذا حدث؟ — What happened?"
      description: "صف الخلل بوضوح، وأرفق صورة أو مقطعاً قصيراً إن أمكن."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "خطوات إعادة الخلل — Steps to reproduce"
      placeholder: |
        1. أضفت صورتين ومقطع فيديو
        2. ضغطت «تقسيم» عند الثانية 3
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "ماذا توقعت أن يحدث؟ — Expected behavior"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "الجزء المتأثر — Area"
      options:
        - "المحرر والخط الزمني — Editor / timeline"
        - "المعاينة والمؤثرات — Preview / effects"
        - "التصدير — Export"
        - "المساعد الذكي — AI assistant"
        - "خادم MCP — MCP server"
        - "التشغيل والتثبيت — Setup / running"
        - "غير ذلك — Other"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: "المتصفح وإصداره — Browser and version"
      placeholder: "Chrome 142"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: "نظام التشغيل — Operating system"
      placeholder: "Windows 11"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: "إصدار Node.js — Node.js version"
      description: "ناتج الأمر `node -v`"
      placeholder: "v22.11.0"
  - type: input
    id: provider
    attributes:
      label: "مزوّد المساعد والنموذج (إن كان الخلل في المساعد) — AI provider and model"
      placeholder: "gemini / gemini-3.6-flash"
  - type: textarea
    id: logs
    attributes:
      label: "رسائل الخطأ — Error messages"
      description: "من نافذة الخادم السوداء، أو من Console في المتصفح (F12). احذف أي مفتاح قبل اللصق."
      render: text
