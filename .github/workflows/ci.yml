name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # المشروع بلا مكتبات، فلا حاجة إلى npm install
      - name: Syntax check
        shell: bash
        run: |
          for f in server/*.js public/js/*.js test/*.js; do
            node --check "$f"
          done
      - name: Tests
        run: npm test
